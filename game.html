<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星球探测 - 核芯震魂</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-select=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,'Microsoft YaHei',sans-serif;background:#07080f;color:#c9d1d9;user-select:none;-webkit-user-select:none;}
header{background:#326de6;color:#fff;padding:14px 0;text-align:center}
header h1{font-size:1.45rem}
header p{font-size:.82rem;opacity:.82;margin-top:3px}
#wrap{max-width:760px;margin:16px auto;padding:0 12px 32px}
#view-box{position:relative;width:100%;border-radius:10px;overflow:hidden;border:2px solid #326de6;background:#000;line-height:0;cursor:move;}
#view{display:block;width:100%;height:auto;}
#hud{position:absolute;inset:0;pointer-events:none;padding:12px 16px;display:flex;flex-direction:column;justify-content:space-between}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start}
.hc{background:rgba(7,8,15,.82);border:1px solid rgba(50,109,230,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:6px;padding:6px 10px;font-family:monospace;font-size:.75rem;color:#89c4ff;line-height:1.7}
.hc b{color:#fff}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;border:1.5px solid rgba(56,189,248,.6);border-radius:50%}
#cross::before,#cross::after{content:'';position:absolute;background:rgba(56,189,248,.6)}
#cross::before{width:8px;height:1.5px;top:50%;left:50%;transform:translate(-50%,-50%)}
#cross::after{width:1.5px;height:8px;top:50%;left:50%;transform:translate(-50%,-50%)}
#tmap-section{margin-top:10px;background:#000;border:1px solid #1a3a1a;border-radius:10px;overflow:hidden}
#tmap-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #0d200d;background:#020802}
#tmap-header span{font-family:monospace;font-size:.72rem;color:#39d353}
.tbtn{padding:4px 12px;border-radius:4px;border:1px solid #1a4a1a;background:#061006;color:#39d353;font-family:monospace;font-size:.7rem;cursor:pointer;transition:all 0.2s;}
.tbtn:hover{background:#0d2a0d;color:#fff;border-color:#39d353}
#tmap-wrap{position:relative;overflow:hidden;cursor:grab;user-select:none}
#tmap-wrap.dragging{cursor:grabbing}
#tmap{display:block;width:100%}
#tmap-hint{position:absolute;bottom:8px;right:10px;font-family:monospace;font-size:.65rem;color:#226e22;pointer-events:none}
#log-strip{margin-top:8px;background:#020802;border:1px solid #0d200d;border-radius:8px;padding:10px 14px;font-family:Consolas,monospace;font-size:.72rem;color:#39d353;line-height:1.65;max-height:110px;overflow-y:auto}
#log-strip .d{color:#1a4a1a}
#log-strip .h{color:#7ee787;font-weight:bold}
#log-strip .w{color:#e3b341}
#ctrl-row{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.cpad{background:#0d1117;border-radius:9px;padding:10px;border:1px solid #21262d}
.cpad h4{font-size:.7rem;color:#777;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
.pgrid{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,40px);gap:5px}
.pbtn{background:#161b22;border:1.5px solid #30363d;border-radius:7px;color:#89aaff;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;transition:background .1s}
.pbtn:active,.pbtn.pressed{background:#326de6;border-color:#326de6;color:#fff}
.pbtn.e{visibility:hidden}
.vgrid{display:grid;grid-template-columns:90px;grid-template-rows:repeat(3,40px);gap:5px}
.pbtn.wide{font-size:.72rem;letter-spacing:.04em}
.ichips{flex:1;display:flex;flex-direction:column;gap:7px}
.ic{background:#0d1117;border:1px solid #21262d;border-radius:7px;padding:8px 12px;font-size:.77rem;color:#8b949e;line-height:1.5}
.ic b{color:#89c4ff}
.arow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ab{padding:8px 16px;border-radius:6px;border:2px solid #326de6;background:#326de6;color:#fff;font-size:.86rem;font-weight:bold;cursor:pointer;transition:background .15s}
.ab:hover{background:#2248b5;border-color:#2248b5}
.ab.g{background:transparent;color:#326de6}
.ab.g:hover{background:#326de6;color:#fff}
hr{border:0;border-top:1px solid #21262d;margin-top:18px}
.bk{display:inline-block;margin-top:12px;color:#326de6;text-decoration:none;font-weight:bold}
.bk:hover{color:#89c4ff}
</style>
</head>
<body>
<header>
  <h1>🛸 星球探测模拟器</h1>
  <p>未知星球 · VL53L0X 高度传感 · HD体素渲染 · 自由3D全景终端</p>
</header>
<div id="wrap">

  <div id="view-box">
    <canvas id="view" width="1280" height="720"></canvas>
    <div id="hud">
      <div class="hud-row">
        <div class="hc" id="hc-planet"><b>行星</b> ——<br><b>坐标</b> X:— Y:—</div>
        <div class="hc" id="hc-alt"><b>高度</b> — m<br><b>地距</b> — m</div>
      </div>
      <div style="text-align:center;position:relative"><div id="cross"></div></div>
      <div class="hud-row">
        <div class="hc" id="hc-mode">待机</div>
        <div class="hc" id="hc-spd">速度 0.0 m/s</div>
      </div>
    </div>
  </div>

  <div id="tmap-section">
    <div id="tmap-header">
      <span id="tmap-title">📡 地形终端 · TERRAIN TERMINAL — 0 点</span>
      <div style="display:flex;gap:6px">
        <button class="tbtn" id="btn-follow">跟随 ON</button>
        <button class="tbtn" id="btn-clearsv">清空</button>
      </div>
    </div>
    <div id="tmap-wrap">
      <canvas id="tmap" width="700" height="350"></canvas>
      <div id="tmap-hint">左键平移 · 右键/双指旋转 · 滚轮缩放</div>
    </div>
  </div>

  <div id="log-strip"><span class="d">核芯震魂 探测终端 v4.0 HD — 等待启动...</span></div>

  <div id="ctrl-row">
    <div class="cpad">
      <h4>推进</h4>
      <div class="pgrid">
        <div class="pbtn e"></div>
        <div class="pbtn" data-key="w">▲ 前进</div>
        <div class="pbtn e"></div>
        <div class="pbtn e"></div>
        <div class="pbtn" data-key="s">▼ 后退</div>
        <div class="pbtn e"></div>
      </div>
    </div>
    <div class="cpad">
      <h4>升降</h4>
      <div class="vgrid">
        <div class="pbtn wide" data-key=" ">▲ 上升</div>
        <div class="pbtn wide" id="btn-hover">— 悬停</div>
        <div class="pbtn wide" data-key="z">▼ 下降</div>
      </div>
    </div>
    <div class="ichips">
      <div class="ic"><b>按住主画面左右滑动</b> 旋转视野 · <b>W/S</b> 前后平移移动</div>
      <div class="ic"><b>3D终端控制</b>：鼠标左键拖动平移，<b>鼠标右键拖动（或触屏双指滑动）可360°旋转全景立体视角</b>。</div>
    </div>
  </div>

  <div class="arow">
    <button class="ab" id="btn-np">🌍 新星球</button>
    <button class="ab g" id="btn-land">自动着陆</button>
    <button class="ab g" id="btn-to">垂直起飞</button>
  </div>

  <hr>
  <a href="index.html" class="bk">← 返回主页</a>
</div>

<script>
(function () {
'use strict';

// 🌟 1. 画质大幅度提升：画布物理大小升级至 1280x720 超采样
var VW = 1280, VH = 720;
var MAP = 256, MASK = MAP - 1;
var VSCALE = 320, FAR = 420, HSCALE = 0.45;

var viewCanvas = document.getElementById('view');
var vctx = viewCanvas.getContext('2d');
var imgd = vctx.createImageData(VW, VH);
var b32  = new Uint32Array(imgd.data.buffer);
var yBuf = new Float32Array(VW);

var tmapCanvas = document.getElementById('tmap');
var tctx = tmapCanvas.getContext('2d');
var TW = tmapCanvas.width, TH = tmapCanvas.height;

function resizeTmap() {
  var w = tmapCanvas.parentElement.clientWidth || 700;
  if (w < 200) w = 700;
  tmapCanvas.width = w;
  TW = w;
}
resizeTmap();
window.addEventListener('resize', resizeTmap);

var hmap = new Uint8Array(MAP * MAP);
var cmap = new Uint32Array(MAP * MAP);

var cam = { x: 128, y: 128, z: 120, angle: 0, pitch: VH * 0.48 };
var vz = 0, hoverLock = false, planet = null, keys = {};

// 🌟 3. 自由视角全动态 3D 相机矩阵状态参数
var tPan = { x: 0, y: 0, z: 0 }; 
var tOrbit = { theta: 0.7, phi: 1.1, radius: 2.2 }; 
var tFollow = true, termDirty = true;

function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function hash2(xi, yi, seed) {
  var n = Math.sin(xi * 127.1 + yi * 311.7 + seed * 74.3) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y, seed) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = smooth(x - ix), fy = smooth(y - iy);
  return lerp(lerp(hash2(ix,iy,seed),hash2(ix+1,iy,seed),fx),
              lerp(hash2(ix,iy+1,seed),hash2(ix+1,iy+1,seed),fx), fy);
}
function fbm(x, y, seed, oct) {
  var v = 0, amp = 0.5, freq = 1;
  for (var i = 0; i < oct; i++) {
    v += valueNoise(x*freq, y*freq, seed+i*100) * amp;
    amp *= 0.52; freq *= 2.1;
  }
  return v;
}

function packRGBA(r, g, b) {
  r = r<0?0:r>255?255:r|0;
  g = g<0?0:g>255?255:g|0;
  b = b<0?0:b>255?255:b|0;
  return (0xFF000000 | (b<<16) | (g<<8) | r) >>> 0;
}

var PLANET_DEFS = [
  { id:'VOLCANIC', name:'火山星 IGNIS', skyT:[15,0,0], skyB:[75,22,0], fog:[100,30,5], stars:false, cf:function(h,n){ if(h<50)return packRGBA(210+n*12,70+n*20,n*4); var r=90+(h-50)*0.7+n*15; return packRGBA(r,r*0.28,n*5); }},
  { id:'CRYSTAL', name:'晶体星 PRISMA', skyT:[5,0,22], skyB:[18,0,50], fog:[12,0,65], stars:true, cf:function(h,n){ var t=h/220; return packRGBA(lerp(20,100,t)+n*25,lerp(8,60,t)+n*8,lerp(100,235,t)+n*18); }},
  { id:'ICE', name:'冰原星 GLACIUS', skyT:[5,10,26], skyB:[12,26,65], fog:[30,55,110], stars:true, cf:function(h,n){ var v=lerp(140,250,h/220)+n*10; return packRGBA(v*0.82,v*0.91,v); }},
  { id:'DESERT', name:'沙漠星 SOLARA', skyT:[22,11,0], skyB:[65,32,5], fog:[140,82,26], stars:false, cf:function(h,n){ var t=h/220; return packRGBA(lerp(185,235,t)+n*12,lerp(105,165,t)+n*8,lerp(20,60,t)+n*5); }},
  { id:'JUNGLE', name:'丛林星 VIRIDIS', skyT:[0,10,4], skyB:[0,26,10], fog:[0,40,15], stars:false, cf:function(h,n){ var t=h/220; return packRGBA(lerp(10,60,t)+n*8,lerp(60,165,t)+n*18,lerp(10,32,t)+n*5); }}
];

var STARS = [];
for (var si = 0; si < 450; si++)
  STARS.push({x:Math.random(), y:Math.random(), br:0.3+Math.random()*0.7});

function genPlanet(typeIdx) {
  if (typeIdx === undefined || typeIdx === null)
    typeIdx = Math.floor(Math.random() * PLANET_DEFS.length);
  planet = PLANET_DEFS[typeIdx];
  var seed = Math.floor(Math.random() * 9999), inv = 1/MAP;
  for (var py=0; py<MAP; py++) for (var px=0; px<MAP; px++) {
    var h0 = fbm(px*inv*4, py*inv*4, seed, 6);
    var h = (h0*1.85-0.1)*200+18;
    h = h<0?0:h>255?255:h|0;
    var n = valueNoise(px*inv*16, py*inv*16, seed+999)*28|0;
    hmap[py*MAP+px] = h;
    cmap[py*MAP+px] = planet.cf(h, n);
  }
  cam.x=MAP/2; cam.y=MAP/2; cam.z=120; cam.angle=0;
  vz=0; hoverLock=false;
  survey.length=0; lastSurveyMs=0;
  tPan={x:0, y:0, z:0}; tOrbit={theta:0.6, phi:1.0, radius:2.5};
  logLines=[];
  tLog('[BOOT] '+planet.name+'  seed:'+seed.toString(16).toUpperCase());
  tLog('[SYS]  VL53L0X 高清就绪  3D地形全景构建中...');
}

function terrainAt(x, y) { return hmap[((y|0)&MASK)*MAP+((x|0)&MASK)]; }
function gDist() { return Math.max(0, (cam.z - terrainAt(cam.x,cam.y)) * HSCALE); }

var survey=[], lastSurveyMs=0, SURVEY_MS=50, MAX_PTS=6000;

function collectPoint() {
  var now = Date.now();
  if (now-lastSurveyMs < SURVEY_MS) return;
  lastSurveyMs = now;
  var dist=gDist(), roverZ=cam.z*HSCALE, groundZ=roverZ-dist;
  survey.push({wx:cam.x, wy:cam.y, gz:groundZ, rz:roverZ});
  if (survey.length>MAX_PTS) survey.shift();
  termDirty = true;
}

// 🌟 渲染：高精度体素步进，dz更加精密
function renderVoxel() {
  var sinA=Math.sin(cam.angle), cosA=Math.cos(cam.angle);
  var skyT=planet.skyT, skyB=planet.skyB, fog=planet.fog;
  for (var sy=0; sy<VH; sy++) {
    var t=sy/VH;
    var sc=(0xFF000000|(lerp(skyT[2],skyB[2],t)|0)<<16|(lerp(skyT[1],skyB[1],t)|0)<<8|(lerp(skyT[0],skyB[0],t)|0))>>>0;
    var row=sy*VW; for (var sx=0; sx<VW; sx++) b32[row+sx]=sc;
  }
  if (planet.stars) {
    var horizon=cam.pitch|0;
    for (var si2=0; si2<STARS.length; si2++) {
      var st=STARS[si2], stx=(st.x*VW)|0, sty=(st.y*horizon*0.94)|0;
      if (sty<0||sty>=VH) continue;
      var sv=(st.br*210)|0;
      b32[sty*VW+stx]=(0xFF000000|(sv<<16)|(sv<<8)|sv)>>>0;
    }
  }
  yBuf.fill(VH);
  var dz=0.8; // 提升步进速度增加前视解析度
  for (var z=1; z<FAR; z+=dz) {
    var plx=-cosA*z-sinA*z, ply=sinA*z-cosA*z;
    var prx=cosA*z-sinA*z,  pry=-sinA*z-cosA*z;
    var dx=(prx-plx)/VW, dy=(pry-ply)/VW;
    var rx=cam.x+plx, ry=cam.y+ply;
    var invz=VSCALE/z, fogT=(z/FAR)*(z/FAR); if(fogT>1)fogT=1;
    for (var col=0; col<VW; col++) {
      var idx=((ry|0)&MASK)*MAP+((rx|0)&MASK);
      var projY=((cam.z-hmap[idx])*invz+cam.pitch)|0;
      if (projY<yBuf[col]) {
        var tc=cmap[idx];
        var fc=(0xFF000000|(lerp((tc>>>16)&0xFF,fog[2],fogT)|0)<<16|(lerp((tc>>>8) &0xFF,fog[1],fogT)|0)<<8|(lerp(tc&0xFF,fog[0],fogT)|0))>>>0;
        var top=projY<0?0:projY, bot=yBuf[col]>VH?VH:yBuf[col]|0;
        for (var row2=top; row2<bot; row2++) b32[row2*VW+col]=fc;
        yBuf[col]=projY;
      }
      rx+=dx; ry+=dy;
    }
    dz+=0.003;
  }
  vctx.putImageData(imgd,0,0);
}

// 🌟 3. 自由3D视角投射算法矩阵 (全方向旋转支持)
function proj3D(wx, wy, wz) {
  var dx = wx - tPan.x;
  var dy = wy - tPan.y;
  var dz = wz - tPan.z;

  var cosT = Math.cos(tOrbit.theta), sinT = Math.sin(tOrbit.theta);
  var cosP = Math.cos(tOrbit.phi),   sinP = Math.sin(tOrbit.phi);

  // 核心旋转变换
  var x1 = cosT * dx + sinT * dy;
  var y1 = -sinT * dx + cosT * dy;
  
  var camX = cosP * x1 - sinP * dz;
  var camZ = sinP * x1 + cosP * dz;
  var camY = y1;

  var f = 400 / (tOrbit.radius * 200 + camZ);
  return {
    sx: TW / 2 + camX * f * 30,
    sy: TH / 2 - camY * f * 30
  };
}

var termFrame=0;
function renderTerminal() {
  termFrame++;
  if (!termDirty && termFrame%2!==0) return;
  termDirty=false;
  tctx.fillStyle='#010502'; tctx.fillRect(0,0,TW,TH);
  
  if (survey.length<2) {
    tctx.fillStyle='#1a4a1a'; tctx.font='13px monospace'; tctx.textAlign='center';
    tctx.fillText('📡 TERRAIN TERMINAL — 等待传感器数据...',TW/2,TH/2);
    tctx.textAlign='left'; return;
  }
  
  if (tFollow) {
    var lastPt = survey[survey.length-1];
    tPan.x += (lastPt.wx - tPan.x) * 0.1;
    tPan.y += (lastPt.wy - tPan.y) * 0.1;
    tPan.z += (lastPt.gz - tPan.z) * 0.1;
  }

  var N=survey.length, minGz=Infinity, maxGz=-Infinity;
  for (var ki=0; ki<N; ki++){if(survey[ki].gz<minGz)minGz=survey[ki].gz;if(survey[ki].gz>maxGz)maxGz=survey[ki].gz;}
  var rangeGz=maxGz-minGz; if(rangeGz<1)rangeGz=1;
  
  // 绘制 3D 探测连线
  tctx.lineWidth=2; tctx.lineJoin='round';
  for (var i=1; i<N; i++) {
    var pa=proj3D(survey[i-1].wx,survey[i-1].wy,survey[i-1].gz);
    var pb=proj3D(survey[i].wx,survey[i].wy,survey[i].gz);
    if(pa.sx<-100||pa.sx>TW+100||pa.sy<-100||pa.sy>TH+100) continue;
    var t2=(survey[i].gz-minGz)/rangeGz;
    tctx.strokeStyle='rgb('+(lerp(0,50,t2)|0)+','+(lerp(140,255,t2)|0)+','+(lerp(50,140,t2)|0)+')';
    tctx.beginPath(); tctx.moveTo(pa.sx,pa.sy); tctx.lineTo(pb.sx,pb.sy); tctx.stroke();
  }
  
  // 绘制3D轨迹星空高度指示虚线
  tctx.strokeStyle='rgba(56,189,248,0.4)'; tctx.lineWidth=1; tctx.setLineDash([2,3]);
  tctx.beginPath(); var altStarted=false;
  for (var j=0; j<N; j++) {
    var pp=proj3D(survey[j].wx,survey[j].wy,survey[j].rz);
    if(pp.sx<-100||pp.sx>TW+100||pp.sy<-100||pp.sy>TH+100){altStarted=false;continue;}
    if(!altStarted){tctx.moveTo(pp.sx,pp.sy);altStarted=true;} else tctx.lineTo(pp.sx,pp.sy);
  }
  tctx.stroke(); tctx.setLineDash([]);

  var last=survey[N-1], lp=proj3D(last.wx,last.wy,last.gz);
  tctx.fillStyle='#fff'; tctx.beginPath(); tctx.arc(lp.sx,lp.sy,5,0,Math.PI*2); tctx.fill();
  
  var pulse=(Date.now()%1000)/1000;
  tctx.strokeStyle='rgba(57,211,83,'+(1-pulse)+')'; tctx.lineWidth=2;
  tctx.beginPath(); tctx.arc(lp.sx,lp.sy,5+pulse*18,0,Math.PI*2); tctx.stroke();

  tctx.fillStyle='#39d353'; tctx.font='11px monospace';
  document.getElementById('tmap-title').textContent = '📡 地形终端 · 全景空间三维网络 — '+N+' 采样点';
}

function updateHUD() {
  var dist=gDist(), alt=(cam.z*HSCALE).toFixed(1);
  document.getElementById('hc-planet').innerHTML='<b>'+planet.name+'</b><br><b>坐标</b> X:'+String(cam.x|0).padStart(3,'0')+' Y:'+String(cam.y|0).padStart(3,'0');
  document.getElementById('hc-alt').innerHTML='<b>高度</b> '+alt+' m<br><b>地距</b> '+dist.toFixed(1)+' m';
  var mode=dist<1.5?'🟢 已着陆':dist<5?'🟡 低空':dist<50?'🔵 扫描':'🟣 巡航';
  if(hoverLock)mode='⚪ 悬停';
  document.getElementById('hc-mode').textContent=mode;
  document.getElementById('hc-spd').textContent='速度 '+(Math.abs(vz)*2).toFixed(1)+' m/s';
  
  if (Date.now()%2000<16) tLog('[VL53L0X] 激光反馈地距:'+dist.toFixed(3)+'m  当前高度轴:'+alt+'m');
}

var logLines=[];
function tLog(msg) {
  logLines.push(msg); if(logLines.length>40)logLines.shift();
  var el=document.getElementById('log-strip');
  el.innerHTML=logLines.map(function(l,i){
    if(l.indexOf('[LAND]')===0||l.indexOf('[TAKE]')===0)return'<span class="h">'+l+'</span>';
    if(l.indexOf('[WARN]')===0)return'<span class="w">'+l+'</span>';
    if(i<logLines.length-1)return'<span class="d">'+l+'</span>';
    return l;
  }).join('<br>');
  el.scrollTop=el.scrollHeight;
}

var MOVE=0.9, THRUST=0.24, DRAG=0.87;
function update() {
  if(!planet)return;
  var s=Math.sin(cam.angle), c=Math.cos(cam.angle);
  if(keys['w']||keys['W']||keys['ArrowUp'])   {cam.x+=c*MOVE;cam.y+=s*MOVE; termDirty=true;}
  if(keys['s']||keys['S']||keys['ArrowDown']) {cam.x-=c*MOVE;cam.y-=s*MOVE; termDirty=true;}
  cam.x=(cam.x+MAP)%MAP; cam.y=(cam.y+MAP)%MAP;
  if(!hoverLock){
    if(keys[' '])             vz+=THRUST;
    if(keys['z']||keys['Z']) vz-=THRUST;
    vz*=DRAG; cam.z+=vz;
  } else {
    vz=0;
    if(keys[' '])             {hoverLock=false;vz+=THRUST;}
    if(keys['z']||keys['Z']) {hoverLock=false;vz-=THRUST;}
  }
  var minZ=terrainAt(cam.x,cam.y)+4;
  if(cam.z<minZ){cam.z=minZ;if(vz<0)vz=0;}
  if(cam.z>620){cam.z=620;vz=0;}
}

var autoCmd=null;
function doAutoLand()   {autoCmd='land';hoverLock=false;tLog('[LAND] 自动着陆开启...');}
function doAutoTakeoff(){autoCmd='to';  hoverLock=false;tLog('[TAKE] 垂直起飞中...');}
function runAuto() {
  if(!autoCmd)return;
  var d=gDist();
  if(autoCmd==='land'){
    if(d>1.5){vz-=0.16;if(vz<-3)vz=-3;}
    else{vz=0;hoverLock=true;autoCmd=null;tLog('[LAND] ✓ 已安全平稳着陆');}
  } else {
    var target=terrainAt(cam.x,cam.y)+80;
    if(cam.z<target){vz+=0.20;if(vz>4)vz=4;}
    else{hoverLock=true;autoCmd=null;tLog('[TAKE] ✓ 已上升到预定高度悬停');}
  }
}

function loop() {
  update(); runAuto(); collectPoint();
  renderVoxel(); renderTerminal(); updateHUD();
  requestAnimationFrame(loop);
}

// 🌟 2. 核心调整：AD转向去除，改为针对主画面的滑屏/拖拽操作
var isViewDragging = false;
var lastViewX = 0;
var viewBox = document.getElementById('view-box');

viewBox.addEventListener('mousedown', function(e) {
  isViewDragging = true;
  lastViewX = e.clientX;
});
window.addEventListener('mousemove', function(e) {
  if (!isViewDragging) return;
  var deltaX = e.clientX - lastViewX;
  cam.angle += deltaX * 0.005; // 滑动调向敏感度
  lastViewX = e.clientX;
});
window.addEventListener('mouseup', function() {
  isViewDragging = false;
});

// 触屏滑动支持
viewBox.addEventListener('touchstart', function(e) {
  if(e.touches.length === 1) {
    isViewDragging = true;
    lastViewX = e.touches[0].clientX;
  }
}, {passive: true});
viewBox.addEventListener('touchmove', function(e) {
  if(!isViewDragging || e.touches.length !== 1) return;
  var deltaX = e.touches[0].clientX - lastViewX;
  cam.angle += deltaX * 0.008;
  lastViewX = e.touches[0].clientX;
}, {passive: true});
viewBox.addEventListener('touchend', function() {
  isViewDragging = false;
});

// === 键盘支持 ===
document.addEventListener('keydown',function(e){
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown'].indexOf(e.key)>=0) e.preventDefault();
  var btn=document.querySelector('.pbtn[data-key="'+e.key+'"]');
  if(btn)btn.classList.add('pressed');
});
document.addEventListener('keyup',function(e){
  keys[e.key]=false;
  var btn=document.querySelector('.pbtn[data-key="'+e.key+'"]');
  if(btn)btn.classList.remove('pressed');
});

document.querySelectorAll('.pbtn[data-key]').forEach(function(btn){
  var k=btn.dataset.key;
  function dn(){keys[k]=true; btn.classList.add('pressed');}
  function up(){keys[k]=false;btn.classList.remove('pressed');}
  btn.addEventListener('mousedown',dn); btn.addEventListener('mouseup',up); btn.addEventListener('mouseleave',up);
  btn.addEventListener('touchstart',function(e){e.preventDefault();dn();},{passive:false});
  btn.addEventListener('touchend',  function(e){e.preventDefault();up();},{passive:false});
});

document.getElementById('btn-hover').addEventListener('click',function(){
  hoverLock=!hoverLock;vz=0;tLog(hoverLock?'[HOVR] 高度锁定激活':'[HOVR] 高度锁定解除');
});

// 🌟 3. 终端高级全景3D空间交互逻辑（任意视角旋转 + 平移 + 缩放）
var tw=document.getElementById('tmap-wrap');
var tDragMode = 0; // 1:左键平移, 2:右键旋转
var tDragX=0, tDragY=0;

tw.addEventListener('contextmenu', function(e) { e.preventDefault(); }); // 禁用右键菜单

tw.addEventListener('mousedown', function(e) {
  tDragMode = (e.button === 2 || e.ctrlKey) ? 2 : 1;
  tw.classList.add('dragging');
  tDragX = e.clientX; tDragY = e.clientY;
  tFollow = false; 
  document.getElementById('btn-follow').textContent = '跟随 OFF';
});

window.addEventListener('mousemove', function(e) {
  if (tDragMode === 0) return;
  var dx = e.clientX - tDragX;
  var dy = e.clientY - tDragY;
  tDragX = e.clientX; tDragY = e.clientY;

  if (tDragMode === 1) {
    // 平移逻辑
    var factor = tOrbit.radius * 0.2;
    tPan.x -= (dx * Math.cos(tOrbit.theta) - dy * Math.sin(tOrbit.theta)) * factor;
    tPan.y -= (dx * Math.sin(tOrbit.theta) + dy * Math.cos(tOrbit.theta)) * factor;
  } else if (tDragMode === 2) {
    // 🌟 核心：随意视角空间旋转逻辑
    tOrbit.theta -= dx * 0.01;
    tOrbit.phi = Math.max(0.1, Math.min(Math.PI/2 - 0.05, tOrbit.phi - dy * 0.01));
  }
  termDirty = true;
});

window.addEventListener('mouseup', function() { 
  tDragMode = 0; 
  tw.classList.remove('dragging'); 
});

// 滚轮缩放
tw.addEventListener('wheel', function(e) {
  e.preventDefault();
  if(e.deltaY > 0) tOrbit.radius *= 1.08;
  else tOrbit.radius /= 1.08;
  tOrbit.radius = Math.max(0.5, Math.min(10, tOrbit.radius));
  termDirty = true;
}, {passive:false});

// 移动端多点触控双指旋转
var tTouchStartDist = 0;
tw.addEventListener('touchstart', function(e) {
  tFollow = false;
  document.getElementById('btn-follow').textContent = '跟随 OFF';
  if (e.touches.length === 1) {
    tDragMode = 1; tDragX = e.touches[0].clientX; tDragY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    tDragMode = 2; // 双指直接开启旋转模式
    tTouchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    tDragX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    tDragY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  }
}, {passive: true});

tw.addEventListener('touchmove', function(e) {
  if (tDragMode === 0) return;
  if (e.touches.length === 1 && tDragMode === 1) {
    var dx = e.touches[0].clientX - tDragX;
    var dy = e.touches[0].clientY - tDragY;
    tDragX = e.touches[0].clientX; tDragY = e.touches[0].clientY;
    tPan.x -= dx * 0.15; tPan.y -= dy * 0.15;
    termDirty = true;
  } else if (e.touches.length === 2 && tDragMode === 2) {
    var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    var dx = midX - tDragX; var dy = midY - tDragY;
    tDragX = midX; tDragY = midY;
    
    // 旋转
    tOrbit.theta -= dx * 0.015;
    tOrbit.phi = Math.max(0.1, Math.min(Math.PI/2 - 0.05, tOrbit.phi - dy * 0.015));
    
    // 缩放
    var dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if(tTouchStartDist > 0) {
      tOrbit.radius /= (dist / tTouchStartDist);
      tOrbit.radius = Math.max(0.5, Math.min(10, tOrbit.radius));
      tTouchStartDist = dist;
    }
    termDirty = true;
  }
}, {passive: false});

tw.addEventListener('touchend', function() { tDragMode = 0; });

document.getElementById('btn-np').addEventListener('click',function(){genPlanet();});
document.getElementById('btn-land').addEventListener('click',doAutoLand);
document.getElementById('btn-to').addEventListener('click',doAutoTakeoff);
document.getElementById('btn-follow').addEventListener('click',function(){
  tFollow=!tFollow;this.textContent='跟随 '+(tFollow?'ON':'OFF');termDirty=true;
});
document.getElementById('btn-clearsv').addEventListener('click',function(){
  survey.length=0;termDirty=true;tLog('[SYS] 3D地形数据已重置清空');
});

genPlanet();
loop();

}());
