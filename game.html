<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO-7 巡视器 · 地形勘测任务</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#07090c;
    --panel:#0b1117;
    --panel-2:#0e161e;
    --line:#1c2a35;
    --ink:#cfe3e8;
    --dim:#5e7681;
    --phos:#41e8c8;      /* 磷光青:数据/扫描 */
    --amber:#ffb454;     /* 琥珀:遥测/警示 */
    --rust:#c96f4a;      /* 地表锈红 */
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"JetBrains Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono)}
  #app{display:flex;height:100%}

  /* ---------- 3D 视口 ---------- */
  #viewport{position:relative;flex:1;min-width:0}
  #gl{display:block;width:100%;height:100%}
  .hud{position:absolute;pointer-events:none;font-size:12px;letter-spacing:.08em}
  #modeChip{top:14px;left:14px;padding:6px 12px;border:1px solid var(--line);
    background:rgba(7,9,12,.72);backdrop-filter:blur(4px);display:flex;gap:10px;align-items:center}
  #modeChip .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  #modeChip.auto .dot{background:var(--phos);box-shadow:0 0 8px var(--phos)}
  #scanBanner{top:14px;left:50%;transform:translateX(-50%);padding:5px 14px;color:var(--phos);
    border:1px solid rgba(65,232,200,.4);background:rgba(7,20,18,.75);display:none}
  #keys{bottom:12px;left:14px;color:var(--dim);line-height:1.9;background:rgba(7,9,12,.55);padding:8px 12px;border:1px solid var(--line)}
  #keys b{color:var(--ink);font-weight:600}
  .back-btn{position:absolute;top:14px;right:14px;z-index:5;pointer-events:auto;
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-decoration:none;
    color:var(--ink);padding:6px 12px;border:1px solid var(--line);
    background:rgba(7,9,12,.72);backdrop-filter:blur(4px);transition:border-color .15s,color .15s}
  .back-btn:hover{border-color:var(--phos);color:var(--phos)}
  .back-btn:focus-visible{outline:1px solid var(--phos);outline-offset:2px}
  #gyro{right:14px;bottom:12px;width:118px;height:118px}
  #warnHud{top:52px;left:50%;transform:translateX(-50%);padding:5px 14px;display:none;
    color:#ff6b5e;border:1px solid rgba(255,107,94,.55);background:rgba(30,8,8,.82);letter-spacing:.1em}
  #fpvHud{display:none;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,90,77,.92)}
  #fpvHud .cross{font-size:20px;line-height:1}
  #fpvHud .dist{margin-top:8px;font-size:11px;letter-spacing:.14em;text-shadow:0 0 6px rgba(0,0,0,.8)}

  /* ---------- 2D 终端 ---------- */
  #terminal{width:390px;flex:none;display:flex;flex-direction:column;background:var(--panel);
    border-left:1px solid var(--line);position:relative;overflow:hidden}
  /* CRT 扫描线纹理:终端的一点旧硬件质感 */
  #terminal::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px)}
  #terminal header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  #terminal header h1{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--ink)}
  #terminal header h1 small{display:block;color:var(--dim);font-weight:400;font-size:10px;margin-top:3px;letter-spacing:.2em}
  #link{font-size:10px;color:var(--phos);letter-spacing:.1em;display:flex;align-items:center;gap:6px}
  #link::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--phos);
    box-shadow:0 0 8px var(--phos);animation:blink 2.4s infinite}
  @keyframes blink{0%,88%{opacity:1}94%{opacity:.2}100%{opacity:1}}

  .sec{border-bottom:1px solid var(--line);padding:10px 14px}
  .sec .cap{font-size:10px;letter-spacing:.24em;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
  .cap span:last-child{color:var(--amber)}

  #tele{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 12px}
  .t label{display:block;font-size:9px;color:var(--dim);letter-spacing:.18em;margin-bottom:2px}
  .t data{font-size:14px;color:var(--amber)}
  .t data em{font-style:normal;font-size:10px;color:var(--dim);margin-left:2px}
  #bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:2px}
  .bar label{display:block;font-size:9px;color:var(--dim);letter-spacing:.18em;margin-bottom:3px}
  .bt{height:8px;border:1px solid var(--line);background:var(--panel-2);position:relative}
  .bf{position:absolute;inset:1px auto 1px 1px;transition:width .1s}
  #mastFill{background:linear-gradient(90deg,#2a5e55,var(--phos))}
  #fuelFill{background:linear-gradient(90deg,#7a5626,var(--amber))}
  #hullFill{background:linear-gradient(90deg,#2a5e55,var(--phos))}

  canvas.term{display:block;width:100%;background:var(--panel-2);border:1px solid var(--line)}
  #profile{height:172px;touch-action:none;cursor:grab}
  #navmap{height:150px}

  #logWrap{flex:1;min-height:60px;display:flex;flex-direction:column;padding:10px 14px 6px}
  #log{flex:1;overflow-y:auto;font-size:11px;line-height:1.75;color:#9fc3c0;scrollbar-width:thin}
  #log .t0{color:var(--dim)}
  #log .pk{color:var(--phos)}
  #log .wr{color:var(--amber)}
  #log .er{color:#ff6b5e}
  #log::-webkit-scrollbar{width:4px}
  #log::-webkit-scrollbar-thumb{background:var(--line)}

  #ctrls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 14px 12px;border-top:1px solid var(--line)}
  button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink);cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);padding:9px 4px;transition:border-color .15s,color .15s}
  button:hover{border-color:var(--phos);color:var(--phos)}
  button:focus-visible{outline:1px solid var(--phos);outline-offset:2px}
  button.on{border-color:var(--phos);color:var(--phos);background:rgba(65,232,200,.08)}
  #btnMode{grid-column:1/3}
  #btnScan{color:var(--amber)}
  #btnScan:hover{border-color:var(--amber)}

  @media (max-width:900px){
    #app{flex-direction:column}
    #terminal{width:100%;height:46%;border-left:none;border-top:1px solid var(--line)}
    #keys{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <canvas id="gl"></canvas>
    <a href="index.html" class="back-btn">← 返回主页</a>
    <div class="hud" id="modeChip"><span class="dot"></span><span id="modeTxt">手动模式 MANUAL</span></div>
    <div class="hud" id="scanBanner">▚ 正在扫描地形剖面…</div>
    <div class="hud" id="warnHud"></div>
    <canvas class="hud" id="gyro"></canvas>
    <div class="hud" id="fpvHud"><div class="cross">┼</div><div class="dist" id="fpvDist">LASER ∅</div></div>
    <div class="hud" id="keys">
      <b>W/S</b> 前进·后退 &nbsp; <b>A/D</b> 转向 &nbsp; <b>Q/E</b> 桅杆升降 &nbsp; <b>Shift/C</b> 涡轮升·降<br>
      <b>空格</b> 扫描回传 &nbsp; <b>Tab</b> 第一/第三人称 &nbsp; <b>M</b> 手动/自动 &nbsp; <b>拖拽/滚轮</b> 视角
    </div>
  </div>

  <aside id="terminal">
    <header>
      <h1>GEO-7 巡视器<small>SURFACE SURVEY TERMINAL</small></h1>
      <span id="link">下行链路</span>
    </header>

    <div class="sec">
      <div class="cap"><span>遥测 TELEMETRY</span><span id="clock">T+00:00</span></div>
      <div id="tele">
        <div class="t"><label>坐标 X</label><data id="tx">0<em>m</em></data></div>
        <div class="t"><label>坐标 Z</label><data id="tz">0<em>m</em></data></div>
        <div class="t"><label>高程</label><data id="ty">0<em>m</em></data></div>
        <div class="t"><label>航向</label><data id="th">0<em>°</em></data></div>
        <div class="t"><label>速度</label><data id="tv">0.0<em>m/s</em></data></div>
        <div class="t"><label>数据包</label><data id="tp">0</data></div>
        <div class="t"><label>激光 L</label><data id="tfl">--<em>m</em></data></div>
        <div class="t"><label>激光 R</label><data id="tfr">--<em>m</em></data></div>
        <div class="t"><label>垂直激光</label><data id="tvl">0<em>m</em></data></div>
        <div id="bars">
          <div class="bar"><label>桅杆</label><div class="bt"><div id="mastFill" class="bf" style="width:25%"></div></div></div>
          <div class="bar"><label>推进剂</label><div class="bt"><div id="fuelFill" class="bf" style="width:100%"></div></div></div>
          <div class="bar"><label>完整度</label><div class="bt"><div id="hullFill" class="bf" style="width:100%"></div></div></div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="cap"><span>拼接高度图 · 拖动旋转 滚轮缩放</span><span id="profTag">待回传</span></div>
      <canvas id="profile" class="term"></canvas>
    </div>

    <div class="sec">
      <div class="cap"><span>巡视地图 NAV</span><span id="navTag"></span></div>
      <canvas id="navmap" class="term"></canvas>
    </div>

    <div id="logWrap">
      <div class="cap"><span>数据链路 LOG</span></div>
      <div id="log"></div>
    </div>

    <div id="ctrls">
      <button id="btnMode">切换自动巡查 [M]</button>
      <button id="btnScan">扫描 [空格]</button>
      <button id="btnUp">桅杆升 [Q]</button>
      <button id="btnDown">桅杆降 [E]</button>
      <button id="btnFly">推进器 [Shift]</button>
      <button id="btnTerrain" style="grid-column:1/-1">重生成地形</button>
    </div>
  </aside>
</div>

<script>
'use strict';
/* ================= 噪声地形 ================= */
let seed = (Math.random()*1e9)|0;
function hash(ix,iz){
  let n = (ix*374761393 + iz*668265263 + seed*974711) | 0;
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967295;
}
const smooth = t => t*t*(3-2*t);
function noise2(x,z){
  const ix=Math.floor(x), iz=Math.floor(z), fx=x-ix, fz=z-iz;
  const a=hash(ix,iz), b=hash(ix+1,iz), c=hash(ix,iz+1), d=hash(ix+1,iz+1);
  const u=smooth(fx), v=smooth(fz);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x,z){
  let f=0, amp=1, fr=1, tot=0;
  for(let o=0;o<5;o++){ f += noise2(x*fr, z*fr)*amp; tot+=amp; amp*=.5; fr*=2.03; }
  return f/tot;
}
const CHUNK = 120;                 // 地形分块边长(米),无限延伸
const BASE = {x:26, z:-30, r:26};  // 太空基地位置与平整半径
let baseH = null;                  // 基地地坪高程(随种子变化)
function rawH(x,z){
  const s = 0.011;
  let h = fbm(x*s+37.2, z*s+91.7);
  h = Math.pow(h, 1.35);
  const macro = fbm(x*.0016+7.7, z*.0016+3.1);   // 大尺度地貌起伏
  const micro = noise2(x*.33+5.5, z*.33+2.2);    // 细部起伏(高分辨率层)
  return (h-.42)*36 + (macro-.5)*44 + (micro-.5)*.9;
}
function terrainH(x,z){            // 世界坐标 → 高程(基地周边平整过渡)
  const dx=x-BASE.x, dz=z-BASE.z, d2=dx*dx+dz*dz;
  if(d2 < BASE.r*BASE.r){
    if(baseH===null) baseH = rawH(BASE.x, BASE.z);
    const t = smooth(Math.sqrt(d2)/BASE.r);
    return baseH*(1-t) + rawH(x,z)*t;
  }
  return rawH(x,z);
}

/* ================= 场景 ================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1214);
scene.fog = new THREE.Fog(0x2a1c19, 90, 380);
const camera = new THREE.PerspectiveCamera(58, 2, .1, 900);

scene.add(new THREE.HemisphereLight(0xd8b09a, 0x3a2420, .85));
const sun = new THREE.DirectionalLight(0xffd9b0, 1.15);
sun.position.set(-120, 160, 60);
scene.add(sun);

/* ---- 无限地形:分块流式加载(岩石随块生成,确定性哈希保证复访一致) ---- */
const CSEG=52, VIEW=2;                    // 每块细分(高分辨率) / 加载半径(块)
const chunks = new Map();                 // "i,j" -> {mesh, rockGroup, rocks[]}
const terrainMat = new THREE.MeshLambertMaterial({vertexColors:true});
const rockGeo = new THREE.DodecahedronGeometry(1,0);
const rockMat = new THREE.MeshLambertMaterial({color:0x6b4433});
const cLow=new THREE.Color(0x4f2c20), cMid=new THREE.Color(0x9c5a3a), cHigh=new THREE.Color(0xd8a071);

function buildChunk(ci,cj){
  const geo = new THREE.PlaneGeometry(CHUNK,CHUNK,CSEG,CSEG);
  geo.rotateX(-Math.PI/2);
  const ox=ci*CHUNK+CHUNK/2, oz=cj*CHUNK+CHUNK/2;
  const pos=geo.attributes.position;
  const colors=new Float32Array(pos.count*3);
  const normals=new Float32Array(pos.count*3);
  const c=new THREE.Color(); const e=CHUNK/CSEG;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i)+ox, z=pos.getZ(i)+oz;
    const h=terrainH(x,z);
    pos.setY(i,h);
    // 解析法线:相邻块共享同一函数,不会出现接缝阴影
    const nx=terrainH(x-e,z)-terrainH(x+e,z);
    const nz=terrainH(x,z-e)-terrainH(x,z+e);
    const inv=1/Math.hypot(nx,2*e,nz);
    normals[i*3]=nx*inv; normals[i*3+1]=2*e*inv; normals[i*3+2]=nz*inv;
    const t=THREE.MathUtils.clamp((h+22)/44,0,1);
    if(t<.5) c.copy(cLow).lerp(cMid,t*2); else c.copy(cMid).lerp(cHigh,(t-.5)*2);
    const dust=.9+hash(i,ci*131+cj*7)*0.2;
    colors[i*3]=c.r*dust; colors[i*3+1]=c.g*dust; colors[i*3+2]=c.b*dust;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals,3));
  const mesh=new THREE.Mesh(geo, terrainMat);
  mesh.position.set(ox,0,oz);
  // 本块岩石(实体)
  const rg=new THREE.Group(); const rocks=[];
  const cnt=3+((hash(ci*91+17, cj*53+29)*6)|0);
  for(let n=0;n<cnt;n++){
    const x=ci*CHUNK + hash(ci*7+n*13+1, cj*11+n*17+3)*CHUNK;
    const z=cj*CHUNK + hash(ci*19+n*23+5, cj*29+n*31+7)*CHUNK;
    if(x*x+z*z<64) continue;                // 着陆点附近留空
    const bdx=x-BASE.x, bdz=z-BASE.z;
    if(bdx*bdx+bdz*bdz < (BASE.r+6)*(BASE.r+6)) continue;   // 基地区域留空
    const s=.4+hash(ci*3+n, cj*5+n*9)*1.9;
    const sy=s*(.6+hash(ci+n*7, cj+n*3)*.5);
    const rock=new THREE.Mesh(rockGeo, rockMat);
    rock.position.set(x, terrainH(x,z)+s*.3, z);
    rock.scale.set(s, sy, s);
    rock.rotation.set(hash(n,ci)*3, hash(n,cj)*3, hash(ci,n)*3);
    rg.add(rock);
    rocks.push({x, z, r:s*.95, top:terrainH(x,z)+s*.3+sy});
  }
  scene.add(mesh); scene.add(rg);
  chunks.set(ci+','+cj, {mesh, rockGroup:rg, rocks});
}
function disposeChunk(k){
  const c=chunks.get(k); if(!c) return;
  scene.remove(c.mesh); scene.remove(c.rockGroup);
  c.mesh.geometry.dispose();
  chunks.delete(k);
}
function ensureChunks(budget){
  const ci=Math.floor(st.x/CHUNK), cj=Math.floor(st.z/CHUNK);
  const queue=[];
  for(let i=ci-VIEW;i<=ci+VIEW;i++)for(let j=cj-VIEW;j<=cj+VIEW;j++){
    if(!chunks.has(i+','+j)) queue.push([i,j]);
  }
  queue.sort((a,b)=>((a[0]-ci)**2+(a[1]-cj)**2)-((b[0]-ci)**2+(b[1]-cj)**2));
  for(let n=0;n<Math.min(budget,queue.length);n++) buildChunk(queue[n][0],queue[n][1]);
  for(const k of [...chunks.keys()]){                // 卸载远处
    const [i,j]=k.split(',').map(Number);
    if(Math.abs(i-ci)>VIEW+1 || Math.abs(j-cj)>VIEW+1) disposeChunk(k);
  }
}
function rockNear(px,pz,extra){
  for(const rk of baseRocks){
    const ex=rk.x-px, ez=rk.z-pz, rr=rk.r+extra;
    if(ex*ex+ez*ez < rr*rr) return rk;
  }
  for(const ch of chunks.values())
    for(const rk of ch.rocks){
      const ex=rk.x-px, ez=rk.z-pz, rr=rk.r+extra;
      if(ex*ex+ez*ez < rr*rr) return rk;
    }
  return null;
}

/* ---- 太空基地(白色) ---- */
let baseGroup=null, baseRocks=[];
function buildBase(){
  if(baseGroup) scene.remove(baseGroup);
  baseGroup=new THREE.Group(); baseRocks=[];
  if(baseH===null) baseH=rawH(BASE.x,BASE.z);
  const W =new THREE.MeshPhongMaterial({color:0xf3f5f7, shininess:22});
  const W2=new THREE.MeshPhongMaterial({color:0xdde3e8, shininess:12});
  const glow=new THREE.MeshBasicMaterial({color:0x41e8c8});
  const g=baseGroup; g.position.set(BASE.x, baseH, BASE.z);
  // 主穹顶与裙座
  g.add(new THREE.Mesh(new THREE.SphereGeometry(6,26,14,0,Math.PI*2,0,Math.PI/2), W));
  const skirt=new THREE.Mesh(new THREE.CylinderGeometry(6.3,6.7,1,26), W2);
  skirt.position.y=.5; g.add(skirt);
  for(let i=0;i<10;i++){                                    // 环形舷窗
    const a=i/10*Math.PI*2;
    const wnd=new THREE.Mesh(new THREE.BoxGeometry(.6,.32,.1), glow);
    wnd.position.set(Math.sin(a)*5.55, 2.1, Math.cos(a)*5.55);
    wnd.lookAt(0,2.1,0); g.add(wnd);
  }
  // 三条辐射状居住舱段 + 连接廊道
  for(let i=0;i<3;i++){
    const arm=new THREE.Group(); arm.rotation.y=i/3*Math.PI*2+.5;
    const mod=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,6.4,16), W);
    mod.rotation.x=Math.PI/2; mod.position.set(0,1.9,9.2);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(1.9,14,10), W2);
    cap.position.set(0,1.9,12.4);
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,4.2,10), W2);
    tube.rotation.x=Math.PI/2; tube.position.set(0,1.55,4.4);
    const wnd=new THREE.Mesh(new THREE.BoxGeometry(1.6,.3,.08), glow);
    wnd.position.set(0,2.5,9.2); wnd.rotation.x=-.5;
    arm.add(mod,cap,tube,wnd); g.add(arm);
    const a=i/3*Math.PI*2+.5;
    baseRocks.push({x:BASE.x+Math.sin(a)*9.2, z:BASE.z+Math.cos(a)*9.2, r:2.7, top:baseH+4.1});
  }
  // 通信塔 + 闪烁信标
  const tower=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,11,8), W2);
  tower.position.set(-4,5.5,4); g.add(tower);
  for(let i=0;i<3;i++){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(1.6-i*.4,.05,.05), W2);
    bar.position.set(-4,8.6+i*.9,4); g.add(bar);
  }
  const beacon=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),
      new THREE.MeshBasicMaterial({color:0xff5a4d}));
  beacon.position.set(-4,11.2,4); g.add(beacon);
  g.userData.beacon=beacon;
  baseRocks.push({x:BASE.x-4, z:BASE.z+4, r:.55, top:baseH+11.4});
  // 降落坪(青色环标)
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(6,6.4,.4,24), W2);
  pad.position.set(-13,.2,-6); g.add(pad);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(4.4,.12,6,36), glow);

function scanLength(){ return 16 + st.mast*46; }   // 桅杆越高,看得越远

function startScan(fromUser){
  if(st.scanning || st.disabled>0) return;
  const len = scanLength(), wid = len*.6;
  const dx=Math.sin(st.heading), dz=Math.cos(st.heading);
  const rx=dz, rz=-dx;                              // 车体右向
  const NX=40, NZ=54;
  const heights=new Float32Array(NX*NZ);
  let mn=1e9, mx=-1e9;
  for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){
    const v=j/(NZ-1)*len, u=(i/(NX-1)-.5)*wid;
    const h=terrainH(st.x+dx*v+rx*u, st.z+dz*v+rz*u);
    heights[j*NX+i]=h;
    if(h<mn)mn=h; if(h>mx)mx=h;
  }
  st.scanning = {t0:st.clock, dur:1.6, ox:st.x, oz:st.z, dx, dz, rx, rz, len, wid, NX, NZ, heights, mn, mx};
  document.getElementById('scanBanner').style.display='block';
  if(fromUser) log(`发起区域扫描 · 桅杆 ${(st.mast*100)|0}% · 覆盖 ${len.toFixed(0)}×${wid.toFixed(0)}m`);
}

function finishScan(){
  const s = st.scanning; st.scanning=null;
  document.getElementById('scanBanner').style.display='none';
  st.packets++;
  // 3D 残留:扫描区边框
  const hw=s.wid/2, pts=[];
  const per=(u,v)=>{
    const px=s.ox+s.dx*v+s.rx*u, pz=s.oz+s.dz*v+s.rz*u;
    return new THREE.Vector3(px, terrainH(px,pz)+.3, pz);
  };
  for(let i=0;i<=10;i++) pts.push(per(-hw+i/10*s.wid, 0));
  for(let i=0;i<=10;i++) pts.push(per( hw, i/10*s.len));
  for(let i=0;i<=10;i++) pts.push(per( hw-i/10*s.wid, s.len));
  for(let i=0;i<=10;i++) pts.push(per(-hw, s.len-i/10*s.len));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x41e8c8, transparent:true, opacity:.9}));
  scene.add(line);
  st.scanMarks.push({line, born:st.clock});
  // 回传终端:并入拼接高度图
  addScanToMosaic(s);

/* ================= 激光检测器(左右各一束,平行轮列,对地 45°) ================= */
const LMAX=14;                                     // 对地斜射量程
const KN={rock:'岩石', ground:'地形抬升', drop:'陡坎'};
function makeLaserLine(op){
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    new THREE.LineBasicMaterial({color:0xff5a4d,transparent:true,opacity:op}));
}
const laserL=makeLaserLine(.85), laserR=makeLaserLine(.85), laserVert=makeLaserLine(.28);
const dotGeo=new THREE.SphereGeometry(.13,8,8), dotMat=new THREE.MeshBasicMaterial({color:0xff5a4d});
const dotL=new THREE.Mesh(dotGeo,dotMat), dotR=new THREE.Mesh(dotGeo,dotMat);
scene.add(laserL); scene.add(laserR); scene.add(laserVert);
scene.add(dotL); scene.add(dotR);

function castLaser(side){                          // side: -1 左 / +1 右
  // 发射器位于车侧上沿,方向平行于该侧三轮的轮列(纯前向),向下俯 45°
  const o = rover.localToWorld(new THREE.Vector3(side*1.05, 1.88, 1.35));
  const dir = new THREE.Vector3(0, -Math.SQRT1_2, Math.SQRT1_2)
                .applyQuaternion(rover.quaternion).normalize();
  let hit=null;
  for(let t=.6; t<=LMAX; t+=.25){
    const px=o.x+dir.x*t, py=o.y+dir.y*t, pz=o.z+dir.z*t;
    if(py<=terrainH(px,pz)){ hit={t, kind:'ground', px, py:terrainH(px,pz), pz}; break; }
    const rk=rockNear(px,pz,.2);
    if(rk && py<rk.top){ hit={t, kind:'rock', px, py, pz}; break; }
  }
  return {o, dir, hit};
}
function setBeam(line, dot, res){
  const p=line.geometry.attributes.position;
  p.setXYZ(0, res.o.x, res.o.y, res.o.z);
  if(res.hit) p.setXYZ(1, res.hit.px, res.hit.py, res.hit.pz);
  else p.setXYZ(1, res.o.x+res.dir.x*LMAX, res.o.y+res.dir.y*LMAX, res.o.z+res.dir.z*LMAX);
  p.needsUpdate=true;
  line.material.opacity = res.hit? .9 : .3;
  dot.visible=!!res.hit;
  if(res.hit) dot.position.set(res.hit.px, res.hit.py, res.hit.pz);
}
function evalHazard(res){
  // 平地上 45° 斜射的预期读数 = 发射器离地高 × √2;显著偏短=抬升/岩石,偏长或无回波=陡坎
  const eagl = Math.max(.4, res.o.y - terrainH(res.o.x, res.o.z));
  const exp = eagl*Math.SQRT2;
  if(!res.hit) return {t:LMAX, kind:'drop'};
  if(res.hit.kind==='rock') return res.hit;
  if(res.hit.t < exp*.76) return {...res.hit, kind:'ground'};
  if(res.hit.t > exp*1.6)  return {...res.hit, kind:'drop'};
  return null;
}
function updateLaser(){
  rover.updateMatrixWorld(true);
  const L=castLaser(-1), R=castLaser(1);
  setBeam(laserL, dotL, L);
  setBeam(laserR, dotR, R);
  st.lread = {l: L.hit?L.hit.t:LMAX, r: R.hit?R.hit.t:LMAX};
  const hl=evalHazard(L), hr=evalHazard(R);
  st.laser = (hl&&hr) ? (hl.t<=hr.t ? {...hl, side:'左'} : {...hr, side:'右'})
           : hl ? {...hl, side:'左'} : hr ? {...hr, side:'右'} : null;
  // 垂直激光:桅杆头向下测离地(垂直测量数)
  const hp=new THREE.Vector3();
  rover.userData.mast.head.getWorldPosition(hp);
  const gh=terrainH(hp.x,hp.z);
  st.vlaser=Math.max(0, hp.y-gh);
  const q=laserVert.geometry.attributes.position;
  q.setXYZ(0,hp.x,hp.y,hp.z); q.setXYZ(1,hp.x,gh,hp.z);
  q.needsUpdate=true;
}
function pathClear(dist){                          // 当前高度上前方航路是否畅通
  const fx=Math.sin(st.heading), fz=Math.cos(st.heading);
  for(let t=2; t<=dist; t+=1.2){
    const px=st.x+fx*t, pz=st.z+fz*t;
    if(terrainH(px,pz) > st.y-1.2) return false;
    const rk=rockNear(px,pz,1.2);
    if(rk && rk.top > st.y-1) return false;
  }
  return true;
}

/* ================= 自动巡查 ================= */
function genWaypoints(){
  const wps=[]; const R=130;                 // 围绕当前位置的勘测网格
  const bx=st.x, bz=st.z;
  const rows=4;
  for(let r=0;r<rows;r++){
    const z = bz - R + (2*R)*(r/(rows-1));
    const xs = r%2 ? [bx+R,bx-R] : [bx-R,bx+R];
    xs.forEach(x=>wps.push({x,z}));
  }
  return wps;
}
function toggleMode(){
  if(st.mode==='manual'){
    st.mode='auto';
    st.auto={phase:'drive', wpIdx:0, wps:genWaypoints()};
    log('<span class="wr">已切换自动巡查</span> · 围绕当前位置生成勘测网格,执行「行进 → 升杆 → 扫描 → 回传」');
  }else{
    st.mode='manual';
    log('已切换手动遥控');
  }
  syncModeUI();
}
function syncModeUI(){
  const auto = st.mode==='auto';
  document.getElementById('modeChip').classList.toggle('auto', auto);
  document.getElementById('modeTxt').textContent =
    (auto?'自动巡查 AUTO-SURVEY':'手动模式 MANUAL') + (st.cam==='fpv'?' · FPV':'');
  document.getElementById('btnMode').classList.toggle('on', auto);
  document.getElementById('btnMode').textContent = auto?'返回手动遥控 [M]':'切换自动巡查 [M]';
}

function steerTo(wp, dt, spd){                 // 朝航点转向并趋近目标速度,返回剩余距离
  const ddx=wp.x-st.x, ddz=wp.z-st.z;
  const want=Math.atan2(ddx,ddz);
  let diff=want-st.heading;
  while(diff> Math.PI) diff-=2*Math.PI;
  while(diff<-Math.PI) diff+=2*Math.PI;
  st.heading += THREE.MathUtils.clamp(diff, -1.1*dt, 1.1*dt);
  st.speed += (spd-st.speed)*dt*2;
  return Math.hypot(ddx,ddz);
}

function updateAuto(dt){
  const a = st.auto;
  const wp = a.wps[a.wpIdx];
  if(a.phase==='drive'){
    const ddx=wp.x-st.x, ddz=wp.z-st.z;
    const dist=Math.hypot(ddx,ddz);
    const want=Math.atan2(ddx,ddz);
    let diff=want-st.heading;
    while(diff> Math.PI) diff-=2*Math.PI;
    while(diff<-Math.PI) diff+=2*Math.PI;
    st.heading += THREE.MathUtils.clamp(diff, -1.1*dt, 1.1*dt);
    // 激光危险判定:先尝试转向绕行(avoid),持续无法脱困才起飞
    if(!st.air && st.laser){
      a.phase='avoid'; a.avoidT=0; a.clearT=0;
      a.dir = st.laser.side==='左' ? 1 : -1;      // 障碍在左则右转,反之左转
      log(`<span class="wr">激光:${st.laser.side}侧 ${st.laser.t.toFixed(1)}m ${KN[st.laser.kind]} · 尝试转向绕行</span>`);
      return;
    }
    const target = Math.abs(diff)>.6 ? 2.2 : 6.5;
    st.speed += (target-st.speed)*dt*2;
    if(dist<4){ st.speed*= .9; a.phase='raise'; log(`抵达航点 ${a.wpIdx+1}/${a.wps.length},升起桅杆`);}
  }else if(a.phase==='avoid'){
    // 减速转弯,任一侧激光仍报警则继续转;脱离后回到航线
    st.speed += (2.2-st.speed)*dt*2;
    st.heading += a.dir*1.25*dt;
    a.avoidT += dt;
    if(!st.laser){
      a.clearT += dt;
      if(a.clearT>.55){ a.phase='drive'; log('绕行成功,回到规划航线'); }
    }else{
      a.clearT=0;
    }
    if(a.avoidT>3.4){
      a.phase='fly';
      log('<span class="wr">连续转向仍被障碍围困,无法出围 · 自动起飞越障</span>');
    }
  }else if(a.phase==='fly'){
    // 飞行中保持沿规划航线朝当前航点前进
    const dd = steerTo(wp, dt, 5.5);
    if(st.fuel<=.08){
      a.phase='land';
      log('<span class="wr">推进剂不足,沿航线就地降落</span>');
    }else if(!pathClear(15)){
      st.vy += 22*dt;                             // 爬升直到航路畅通
      st.fuel = Math.max(0, st.fuel - dt*.2);
    }else if(pathClear(18)){
      a.phase='land';                             // 悬停怠速自动缓降
    }
    if(dd<4) a.phase='land';
  }else if(a.phase==='land'){
    steerTo(wp, dt, 3);
    if(st.air && !pathClear(9) && st.fuel>.12) a.phase='fly';   // 降落途中又遇障碍,再爬升
    if(!st.air){ a.phase='drive'; log('着陆成功,继续沿规划航线行进'); }
  }else if(a.phase==='raise'){
    st.speed*= (1-3*dt);
    st.mast = Math.min(1, st.mast + dt*.55);
    if(st.mast>=1 && !st.scanning){ startScan(false); a.phase='scan'; }
  }else if(a.phase==='scan'){
    if(!st.scanning){ a.phase='lower'; }
  }else if(a.phase==='lower'){
    st.mast = Math.max(.3, st.mast - dt*.55);
    if(st.mast<=.3){
      a.wpIdx++;
      if(a.wpIdx>=a.wps.length){
        a.wps=genWaypoints(); a.wpIdx=0;
        log('本轮航线勘测完成,围绕当前位置续生成新网格');
      }
      a.phase='drive';
    }
  }
}

/* ================= 事故系统 ================= */
const warnEl = document.getElementById('warnHud');
let flashT=0, flashMsg='';
function accident(reason, dmg){
  if(st.disabled>0) return;
  st.hull = Math.max(0, st.hull - dmg);
  st.shake = Math.min(1, .35 + dmg*.03);
  flashMsg = reason; flashT = 2.4;
  log(`<span class="er">⚠ 事故:${reason} · 结构 −${dmg}% → 剩余 ${st.hull}%</span>`);
  if(st.hull<=0){
    st.disabled = 6; st.speed = 0;
    if(st.mode==='auto'){ st.mode='manual'; syncModeUI(); }
    log('<span class="er">结构完整度归零 · 系统离线,地面站远程重启中(6 秒)…</span>');
  }
}
function updateWarn(tilt, dt){
  flashT -= dt;
  if(st.disabled>0){
    warnEl.style.display='block';
    warnEl.textContent = `⊘ 系统离线 · 重启 ${Math.ceil(st.disabled)}s`;
  }else if(flashT>0){
    warnEl.style.display='block';
    warnEl.textContent = '⚠ 事故:'+flashMsg;
  }else if(tilt>32 && !st.air){
    warnEl.style.display='block';
    warnEl.textContent = `⚠ 姿态临界 ${tilt.toFixed(0)}°`;
  }else{
    warnEl.style.display='none';
  }
}

/* ================= 主循环 ================= */
function updateRover(dt){
  const groundH = terrainH(st.x,st.z);
  /* ---- 离线重启 ---- */
  if(st.disabled>0){
    st.disabled -= dt;
    st.speed *= (1-3*dt);
    if(st.disabled<=0){
      st.hull=45;
      log('<span class="wr">远程重启完成 · 结构完整度恢复至 45%</span>');
    }
  }else{
    if(st.mode==='manual'){
      let thrust = 0;
      if(keys['w']||keys['arrowup']) thrust += 1;
      if(keys['s']||keys['arrowdown']) thrust -= .6;
      st.speed += thrust*(st.air?7:9)*dt;
      st.speed *= (1 - (st.air? .35 : 2.2)*dt);   // 空中惯性大,地面阻尼大
      st.speed = THREE.MathUtils.clamp(st.speed, st.air?-6:-4.5, st.air?12:8);
      const turn = (st.air? .8 : 1.5) * dt * (st.speed>=0||st.air ? 1 : -1);
      if(keys['a']||keys['arrowleft'])  st.heading += turn;
      if(keys['d']||keys['arrowright']) st.heading -= turn;
      if(keys['q']||holdUp)   st.mast=Math.min(1, st.mast+dt*.7);
      if(keys['e']||holdDown) st.mast=Math.max(0, st.mast-dt*.7);
      // 四台垂直涡轮:Shift 上升,C 主动下降
      if((keys['shift']||holdFly) && st.fuel>0){
        st.vy += 26*dt;
        const before=st.fuel;
        st.fuel = Math.max(0, st.fuel - dt*.22);
        if(before>0 && st.fuel===0) log('<span class="wr">推进剂耗尽,注意坠落高度!</span>');
      }
      if(st.air && keys['c']) st.vy -= 9*dt;
    }else{
      updateAuto(dt);
      // 手动介入即退出自动
      if(keys['w']||keys['a']||keys['s']||keys['d']||keys['shift']){ toggleMode(); }
    }
    // 悬停怠速:燃料充足且未主动下降时,四涡轮限制下落速度(垂直软着陆)
    if(st.air && st.fuel>0 && !keys['c'] && st.vy<-2.4){
      st.vy = Math.min(-2.4, st.vy + 14*dt);
      st.fuel = Math.max(0, st.fuel - dt*.04);
    }
  }
  /* ---- 垂直物理:重力 / 起飞 / 着陆 ---- */
  st.vy -= 11*dt;
  st.y  += st.vy*dt;
  if(st.y <= groundH){
    if(st.air){
      const impact = -st.vy;
      if(impact>9)        accident('硬着陆冲击', Math.round(impact*2.2));
      else if(impact>4.5) log('<span class="wr">着陆冲击 '+impact.toFixed(1)+' m/s</span>');
      st.air=false;
    }
    st.y=groundH; st.vy=0;
    st.fuel=Math.min(1, st.fuel + dt*.12);        // 地面缓慢补充推进剂
  }else if(st.y > groundH+.3 && !st.air){
    st.air=true;
    log('四台垂直涡轮升空');
  }
  /* ---- 位移(无限地形,无边界) ---- */
  st.x += Math.sin(st.heading)*st.speed*dt;
  st.z += Math.cos(st.heading)*st.speed*dt;

  /* ---- 实体碰撞:岩石 + 基地建筑 ---- */
  const collide = rk => {
    const ddx=st.x-rk.x, ddz=st.z-rk.z, rr=rk.r+1.6;
    const d2=ddx*ddx+ddz*ddz;
    if(d2 < rr*rr && st.y < rk.top){              // 飞得够高可越过
      const dd=Math.sqrt(d2)||.001, nx=ddx/dd, nz=ddz/dd;
      const into = -(Math.sin(st.heading)*st.speed*nx + Math.cos(st.heading)*st.speed*nz);
      st.x = rk.x + nx*rr;                        // 推出障碍
      st.z = rk.z + nz*rr;
      if(into>3.2 && st.clock-st.lastHit>1.2){
        st.lastHit = st.clock;
        accident('撞击障碍物', Math.round(3+into*2.6));
      }
      st.speed *= .2;
    }
  };
  for(const rk of baseRocks) collide(rk);
  for(const ch of chunks.values()) for(const rk of ch.rocks) collide(rk);

  /* ---- 姿态(陀螺仪数据源) ---- */
  const d=1.5, fx=Math.sin(st.heading), fz=Math.cos(st.heading), rx=fz, rz=-fx;
  let tp, tr;
  if(st.air){
    tp = THREE.MathUtils.clamp(-st.vy*.02, -.3, .3); tr = 0;   // 空中缓慢回平
  }else{
    const hF=terrainH(st.x+fx*d, st.z+fz*d), hB=terrainH(st.x-fx*d, st.z-fz*d);
    const hR=terrainH(st.x+rx*d, st.z+rz*d), hL=terrainH(st.x-rx*d, st.z-rz*d);
    tp = -Math.atan2(hF-hB, 2*d);
    tr =  Math.atan2(hR-hL, 2*d);
  }
  const lk = Math.min(1, dt*9);
  st.pitch += (tp-st.pitch)*lk;
  st.roll  += (tr-st.roll)*lk;
  rover.position.set(st.x, st.y, st.z);
  rover.rotation.order='YXZ';
  rover.rotation.y = st.heading;
  rover.rotation.x = st.pitch;
  rover.rotation.z = st.roll;

  /* ---- 倾覆监测 ---- */
  const tilt = Math.max(Math.abs(st.pitch), Math.abs(st.roll)) * 57.29578;
  if(!st.air && tilt>38 && st.disabled<=0) st.tiltT += dt;
  else st.tiltT = Math.max(0, st.tiltT - dt*2);
  if(st.tiltT>1.1){ st.tiltT=0; accident('坡面姿态倾覆', 22); }
  updateWarn(tilt, dt);

  // 车轮 & 桅杆 & 喷口火焰
  if(!st.air) rover.userData.wheels.forEach(w=>w.rotation.x += st.speed*dt/0.55);
  const liftOn  = (keys['shift']||holdFly) && st.fuel>0 && st.disabled<=0;
  const hoverOn = st.air && st.fuel>0 && st.disabled<=0;
  const liftPow = liftOn?1 : (hoverOn?.42:0);
  const th = rover.userData.thrusters;
  th.lift.forEach(fh=>{
    fh.visible = liftPow>.02;
    if(fh.visible) fh.scale.y = liftPow*(0.8+Math.random()*.4);
  });
  const rearPow = st.air ? THREE.MathUtils.clamp(Math.abs(st.speed)/9, .18, 1) : 0;
  th.rear.visible = rearPow>.05;
  if(th.rear.visible) th.rear.scale.z = rearPow*(0.8+Math.random()*.4);
  const m = rover.userData.mast;
  const h = MAST_MIN + st.mast*(MAST_MAX-MAST_MIN);
  m.pole.scale.y = h; m.pole.position.y = h/2;
  m.head.position.y = h + .18;
  m.lamp.material.color.setHex(st.disabled>0?0xff5544 : st.scanning?0xffffff : 0x41e8c8);

  // 扫描动画:扫掠线自车头向远端推进
  if(st.scanning){
    const s=st.scanning, t=(st.clock-s.t0)/s.dur;
    if(t>=1){ finishScan(); sweep.visible=beam.visible=false; }
    else{
      sweep.visible=beam.visible=true;
      const v=t*s.len;
      const p=sweep.geometry.attributes.position;
      for(let i=0;i<SWEEP_N;i++){
        const u=(i/(SWEEP_N-1)-.5)*s.wid;
        const sx=s.ox+s.dx*v+s.rx*u, sz=s.oz+s.dz*v+s.rz*u;
        p.setXYZ(i, sx, terrainH(sx,sz)+.25, sz);
      }
      p.needsUpdate=true;
      const hp = new THREE.Vector3();
      m.head.getWorldPosition(hp);
      const b=beam.geometry.attributes.position;
      const cx=s.ox+s.dx*v, cz=s.oz+s.dz*v;
      b.setXYZ(0, hp.x, hp.y, hp.z);
      b.setXYZ(1, cx, terrainH(cx,cz)+.25, cz);
      b.needsUpdate=true;
    }
  }
  // 扫描残留淡出
  for(let i=st.scanMarks.length-1;i>=0;i--){
    const mk=st.scanMarks[i], age=st.clock-mk.born;
    mk.line.material.opacity = Math.max(0, .9 - age/8);
    if(age>8){ scene.remove(mk.line); mk.line.geometry.dispose(); st.scanMarks.splice(i,1); }
  }
  // 轨迹
  st.trailT += dt;
  if(st.trailT>.4){ st.trailT=0; st.trail.push([st.x,st.z]); if(st.trail.length>600) st.trail.shift(); }
}

function updateCamera(dt){
  if(st.cam==='fpv'){
    // 第一人称:挂在桅杆头前方,桅杆升得越高看得越远
    rover.updateMatrixWorld(true);
    const hp=new THREE.Vector3();
    rover.userData.mast.head.getWorldPosition(hp);
    const fwd=new THREE.Vector3(0,0,1).applyQuaternion(rover.quaternion);
    camera.position.copy(hp).addScaledVector(fwd,.45);
    camera.position.y += .06;
    const yaw=st.heading+fpvYaw, cp=fpvPitch;
    camera.lookAt(
      camera.position.x+Math.sin(yaw)*Math.cos(cp),
      camera.position.y+Math.sin(cp),
      camera.position.z+Math.cos(yaw)*Math.cos(cp));
  }else{
    const orbit = st.heading + Math.PI + camYaw;
    const cd = camDist, cp = camPitch;
    const tx = st.x + Math.sin(orbit)*Math.cos(cp)*cd;
    const tz = st.z + Math.cos(orbit)*Math.cos(cp)*cd;
    let ty = rover.position.y + Math.sin(cp)*cd + 1.5;
    ty = Math.max(ty, terrainH(tx,tz)+1.8);
    const k = 1-Math.pow(.001, dt);
    camera.position.lerp(new THREE.Vector3(tx,ty,tz), k);
    const look = new THREE.Vector3(st.x, rover.position.y+2.2, st.z);
    camera.lookAt(look);
  }
  if(st.shake>0){
    camera.position.x += (Math.random()-.5)*st.shake;
    camera.position.y += (Math.random()-.5)*st.shake;
    camera.position.z += (Math.random()-.5)*st.shake;
    st.shake *= Math.max(0, 1-5*dt);
    if(st.shake<.01) st.shake=0;
  }
}

/* ================= 终端绘制 ================= */
function fitCanvas(c){
  const dpr = Math.min(devicePixelRatio,2);
  const w = c.clientWidth, h = c.clientHeight;
  if(c.width!==w*dpr||c.height!==h*dpr){ c.width=w*dpr; c.height=h*dpr; }
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return [ctx,w,h];
}

const profileC = document.getElementById('profile');
/* ---- 拼接高度图:多个探测位合成一张,世界坐标配准,可旋转缩放 ---- */
const scans=[];                       // 每个探测位一块贴片
let gmn=1e9, gmx=-1e9;                // 全局高程范围(统一配色)
let mosaicRot=0, mosaicZoom=1;
function bakeScan(s){                 // 按全局范围烘焙贴片:越高越深,越矮越浅
  const off = s.tex || document.createElement('canvas');
  off.width=s.NX; off.height=s.NZ;
  const ictx=off.getContext('2d'), img=ictx.createImageData(s.NX,s.NZ);
  const span=Math.max(gmx-gmn,1e-3);
  const lo={r:0xd6,g:0xf3,b:0xea}, hi={r:0x03,g:0x1a,b:0x15};
  for(let j=0;j<s.NZ;j++)for(let i=0;i<s.NX;i++){
    const t=(s.heights[j*s.NX+i]-gmn)/span;
    const k=(j*s.NX+i)*4;             // 行0 = 探测位近端
    img.data[k]  = lo.r+(hi.r-lo.r)*t;
    img.data[k+1]= lo.g+(hi.g-lo.g)*t;
    img.data[k+2]= lo.b+(hi.b-lo.b)*t;
    img.data[k+3]= 255;
  }
  ictx.putImageData(img,0,0);
  s.tex=off;
}
function addScanToMosaic(s){
  s.rot=Math.atan2(s.dx,s.dz);
  scans.push(s);
  if(scans.length>14) scans.shift();
  const expand = s.mn < gmn-.01 || s.mx > gmx+.01;
  gmn=Math.min(gmn,s.mn); gmx=Math.max(gmx,s.mx);
  if(expand) scans.forEach(bakeScan); else bakeScan(s);
}
// 交互:拖动旋转,滚轮缩放,双击复位
let mosDrag=false, mpx=0;
profileC.addEventListener('pointerdown', e=>{mosDrag=true; mpx=e.clientX; profileC.setPointerCapture(e.pointerId);});
profileC.addEventListener('pointermove', e=>{ if(mosDrag){ mosaicRot+=(e.clientX-mpx)*.01; mpx=e.clientX; } });
profileC.addEventListener('pointerup', ()=>mosDrag=false);
profileC.addEventListener('wheel', e=>{
  e.preventDefault();
  mosaicZoom=THREE.MathUtils.clamp(mosaicZoom*Math.pow(1.0015,-e.deltaY), .35, 9);
}, {passive:false});
profileC.addEventListener('dblclick', ()=>{ mosaicRot=0; mosaicZoom=1; });

function renderProfile(){
  const [ctx,w,h] = fitCanvas(profileC);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(65,232,200,.07)'; ctx.lineWidth=1;
  for(let x=0;x<w;x+=26){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke(); }
  for(let y=0;y<h;y+=22){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke(); }
  if(!scans.length){
    ctx.fillStyle='#3a4d55'; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText('—— 尚无探测位 · 按空格执行区域扫描 ——', w/2, h/2+4);
    return;
  }
  // 覆盖范围与自适应比例
  let bx1=1e9,bz1=1e9,bx2=-1e9,bz2=-1e9;
  for(const s of scans){
    const hw=s.wid/2;
    for(const [u,v] of [[-hw,0],[hw,0],[-hw,s.len],[hw,s.len]]){
      const X=s.ox+s.dx*v+s.rx*u, Z=s.oz+s.dz*v+s.rz*u;
      if(X<bx1)bx1=X; if(X>bx2)bx2=X;
      if(Z<bz1)bz1=Z; if(Z>bz2)bz2=Z;
    }
  }
  const ccx=(bx1+bx2)/2, ccz=(bz1+bz2)/2;
  const extent=Math.max(bx2-bx1, bz2-bz1, 12);
  const k=(Math.min(w,h)-30)/extent*mosaicZoom;
  ctx.save();
  ctx.translate(w/2,h/2); ctx.rotate(mosaicRot); ctx.scale(k,k); ctx.translate(-ccx,-ccz);
  ctx.imageSmoothingEnabled=true;
  for(const s of scans){                       // 各探测位贴片按世界位姿配准
    ctx.save();
    ctx.translate(s.ox,s.oz); ctx.rotate(-s.rot);
    ctx.globalAlpha=.96;
    ctx.drawImage(s.tex, -s.wid/2, 0, s.wid, s.len);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  const last=scans[scans.length-1];            // 最新探测位描边
  ctx.save();
  ctx.translate(last.ox,last.oz); ctx.rotate(-last.rot);
  ctx.strokeStyle='rgba(65,232,200,.85)'; ctx.lineWidth=1.4/k;
  ctx.strokeRect(-last.wid/2, 0, last.wid, last.len);
  ctx.restore();
  // 巡视器当前位置
  ctx.save();
  ctx.translate(st.x,st.z); ctx.rotate(Math.PI-st.heading);
  const ts=4.5/k;
  ctx.fillStyle='#ffb454';
  ctx.beginPath(); ctx.moveTo(0,-ts); ctx.lineTo(ts*.72,ts*.8); ctx.lineTo(-ts*.72,ts*.8); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
  // 图例与读数(屏幕空间)
  const lx=w-20, ly=8, lh=h-38, lw=8;
  const g=ctx.createLinearGradient(0,ly,0,ly+lh);
  g.addColorStop(0,'rgb(3,26,21)'); g.addColorStop(1,'rgb(214,243,234)');
  ctx.fillStyle=g; ctx.fillRect(lx,ly,lw,lh);
  ctx.strokeStyle='#1c2a35'; ctx.strokeRect(lx+.5,ly+.5,lw-1,lh-1);
  ctx.fillStyle='#5e7681'; ctx.font='9px monospace'; ctx.textAlign='right';
  ctx.fillText(gmx.toFixed(1), lx-2, ly+8);
  ctx.fillText(gmn.toFixed(1), lx-2, ly+lh);
  ctx.textAlign='left';
  ctx.fillText(`${scans.length} 探测位 · ×${mosaicZoom.toFixed(1)} · 双击复位`, 6, h-5);
}

/* ---- 导航图(以巡视器为中心的滑动窗口) ---- */
const navC = document.getElementById('navmap');
const NAV_SPAN = 300;              // 窗口边长(米)
let navBackdrop=null, navCenter={x:0,z:0};
const navScans=[];
function buildNavBackdrop(){
  const n=96, off=document.createElement('canvas');
  off.width=n; off.height=n;
  navCenter={x:st.x, z:st.z};
  const ictx=off.getContext('2d'), img=ictx.createImageData(n,n);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const x=navCenter.x+(i/(n-1)-.5)*NAV_SPAN, z=navCenter.z+(j/(n-1)-.5)*NAV_SPAN;
    const t=THREE.MathUtils.clamp((terrainH(x,z)+22)/50,0,1);
    const k=(j*n+i)*4;
    img.data[k]=14+t*46; img.data[k+1]=22+t*40; img.data[k+2]=28+t*36; img.data[k+3]=255;
  }
  ictx.putImageData(img,0,0);
  navBackdrop=off;
}
function renderNav(){
  const [ctx,w,h]=fitCanvas(navC);
  const S=Math.min(w,h);
  const ox=(w-S)/2, oy=(h-S)/2;
  const M = (x,z)=>[ox+((x-navCenter.x)/NAV_SPAN+.5)*S, oy+((z-navCenter.z)/NAV_SPAN+.5)*S];
  ctx.clearRect(0,0,w,h);
  if(navBackdrop) ctx.drawImage(navBackdrop, ox,oy,S,S);
  ctx.strokeStyle='rgba(94,118,129,.5)'; ctx.strokeRect(ox+.5,oy+.5,S-1,S-1);
  ctx.save();
  ctx.beginPath(); ctx.rect(ox,oy,S,S); ctx.clip();
  // 自动航线
  if(st.mode==='auto'&&st.auto.wps.length){
    ctx.strokeStyle='rgba(255,180,84,.35)'; ctx.setLineDash([3,3]); ctx.beginPath();
    st.auto.wps.forEach((p,i)=>{const [a,b]=M(p.x,p.z); i?ctx.lineTo(a,b):ctx.moveTo(a,b);});
    ctx.stroke(); ctx.setLineDash([]);
    st.auto.wps.forEach((p,i)=>{
      const [a,b]=M(p.x,p.z);
      ctx.fillStyle=i===st.auto.wpIdx?'#ffb454':'rgba(255,180,84,.5)';
      ctx.fillRect(a-2,b-2,4,4);
    });
  }
  // 轨迹
  if(st.trail.length>1){
    ctx.strokeStyle='rgba(255,180,84,.8)'; ctx.lineWidth=1; ctx.beginPath();
    st.trail.forEach((p,i)=>{const [a,b]=M(p[0],p[1]); i?ctx.lineTo(a,b):ctx.moveTo(a,b);});
    ctx.stroke();
  }
  // 扫描点
  ctx.fillStyle='#41e8c8';
  navScans.forEach(p=>{const [a,b]=M(p.x,p.z); ctx.beginPath();ctx.arc(a,b,2.2,0,7);ctx.fill();});
  // 太空基地
  const [bmx,bmy]=M(BASE.x,BASE.z);
  ctx.fillStyle='#f3f5f7'; ctx.fillRect(bmx-3,bmy-3,6,6);
  ctx.strokeStyle='#41e8c8'; ctx.lineWidth=1; ctx.strokeRect(bmx-4.5,bmy-4.5,9,9);
  // 车
  const [cx,cy]=M(st.x,st.z);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.PI - st.heading);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(3.6,4); ctx.lineTo(-3.6,4); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();   // 结束窗口裁剪
}

/* ---- 陀螺仪(人工地平仪) ---- */
const gyroC = document.getElementById('gyro');
function renderGyro(){
  const [ctx,w,h] = fitCanvas(gyroC);
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-4;
  ctx.clearRect(0,0,w,h);
  const pitchDeg = -st.pitch*57.29578;          // 抬头为正
  const tilt = Math.max(Math.abs(st.pitch),Math.abs(st.roll))*57.29578;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
  ctx.translate(cx,cy); ctx.rotate(-st.roll);
  const off = pitchDeg*1.5;
  ctx.fillStyle='#101d2a'; ctx.fillRect(-R*2, -R*2, R*4, R*2+off);   // 天
  ctx.fillStyle='#4a2b1e'; ctx.fillRect(-R*2, off,  R*4, R*2);       // 地
  ctx.strokeStyle='rgba(207,227,232,.95)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(-R,off); ctx.lineTo(R,off); ctx.stroke();
  ctx.strokeStyle='rgba(207,227,232,.4)'; ctx.lineWidth=1;
  for(const p of [-30,-20,-10,10,20,30]){
    const y=off+p*1.5, hw=p%20===0?15:8;
    ctx.beginPath(); ctx.moveTo(-hw,y); ctx.lineTo(hw,y); ctx.stroke();
  }
  ctx.restore();
  // 外圈:倾角临界时变红
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7);
  ctx.strokeStyle = tilt>32 ? '#ff6b5e' : 'rgba(94,118,129,.9)';
  ctx.lineWidth=2; ctx.stroke();
  // 固定机标(琥珀)
  ctx.strokeStyle='#ffb454'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-22,cy); ctx.lineTo(cx-8,cy); ctx.lineTo(cx-3,cy+5);
  ctx.moveTo(cx+22,cy); ctx.lineTo(cx+8,cy); ctx.lineTo(cx+3,cy+5);
  ctx.stroke();
  ctx.fillStyle='#ffb454'; ctx.fillRect(cx-1.5,cy-1.5,3,3);
  // 读数:航向 / 俯仰 / 横滚
  const rollDeg = st.roll*57.29578;
  const hdg = ((-st.heading*57.29578)%360+360)%360;
  ctx.font='8px monospace'; ctx.textAlign='center';
  ctx.fillStyle = tilt>32 ? '#ff6b5e' : '#8aa3ad';
  ctx.fillText(`HDG ${String(hdg.toFixed(0)).padStart(3,'0')}°`, cx, cy+R-14);
  ctx.fillText(`P${pitchDeg>=0?'+':''}${pitchDeg.toFixed(0)}  R${rollDeg>=0?'+':''}${rollDeg.toFixed(0)}`, cx, cy+R-5);
}

/* ---- 日志 & 遥测 ---- */
const logEl=document.getElementById('log');
function tstr(){ const s=st.clock|0; return `T+${String((s/60)|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function log(html){
  const div=document.createElement('div');
  div.innerHTML=`<span class="t0">[${tstr()}]</span> ${html}`;
  logEl.appendChild(div);
  while(logEl.children.length>60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop=logEl.scrollHeight;
}
let teleT=0;
function updateTele(dt){
  teleT+=dt; if(teleT<.15) return; teleT=0;
  const put=(id,v)=>document.getElementById(id).firstChild.nodeValue=v;
  put('tx', st.x.toFixed(0)); put('tz', st.z.toFixed(0));
  put('ty', rover.position.y.toFixed(1));
  let deg=(( -st.heading*180/Math.PI)%360+360)%360;
  put('th', deg.toFixed(0)); put('tv', Math.abs(st.speed).toFixed(1));
  put('tfl', st.lread.l.toFixed(1));
  put('tfr', st.lread.r.toFixed(1));
  put('tvl', st.vlaser.toFixed(1));
  document.getElementById('fpvDist').textContent =
    `LASER L ${st.lread.l.toFixed(1)} · R ${st.lread.r.toFixed(1)}` +
    (st.laser? `  ⚠ ${st.laser.side} ${KN[st.laser.kind]}` : '');
  document.getElementById('mastFill').style.width=(st.mast*100).toFixed(0)+'%';
  document.getElementById('fuelFill').style.width=(st.fuel*100).toFixed(0)+'%';
  const hf=document.getElementById('hullFill');
  hf.style.width=st.hull+'%';
  hf.style.background = st.hull<35 ? 'linear-gradient(90deg,#7a2c22,#ff6b5e)' : '';
  document.getElementById('clock').textContent=tstr();
  document.getElementById('navTag').textContent=`扫描点 ${navScans.length} · 窗口 ${NAV_SPAN}m`;
  const ndx=st.x-navCenter.x, ndz=st.z-navCenter.z;
  if(ndx*ndx+ndz*ndz > (NAV_SPAN*.22)**2) buildNavBackdrop();   // 滑动刷新底图
}

/* ================= 按钮 ================= */
let holdUp=false, holdDown=false, holdFly=false;
const bind=(id,fn)=>document.getElementById(id).addEventListener('click',fn);
bind('btnMode', toggleMode);
bind('btnScan', ()=>startScan(true));
bind('btnTerrain', ()=>{
  seed=(Math.random()*1e9)|0;
  st.x=0; st.z=0; st.speed=0; st.trail.length=0; st.auto.wps=[];
  st.y=terrainH(0,0); st.vy=0; st.air=false;
  navScans.length=0;
  resetWorld();
  scans.length=0; gmn=1e9; gmx=-1e9; mosaicRot=0; mosaicZoom=1;
  renderProfile();
  document.getElementById('profTag').textContent='待回传';
  log('<span class="wr">地形已重新生成</span> · 噪声种子 #'+seed.toString(16).toUpperCase());
});
const hold=(id,set)=>{const b=document.getElementById(id);
  b.addEventListener('pointerdown',()=>set(true));
  addEventListener('pointerup',()=>set(false));};
hold('btnUp',  v=>holdUp=v);
hold('btnDown',v=>holdDown=v);
hold('btnFly', v=>holdFly=v);

/* ================= 启动 ================= */
resetWorld();
st.y = terrainH(0,0);
syncModeUI();
log('GEO-7 巡视器着陆完成 · 东北方向可见白色前哨基地,信标闪烁处');
log('左右激光平行轮列、对地 45°:读数偏短=抬升/岩石,偏长=陡坎;多次扫描将拼成一张高度图,可拖动旋转、滚轮缩放');
log('自动巡查:激光报警先转向绕行,持续 3.4s 无法出围才起飞越障,全程沿规划航线');

addEventListener('resize', ()=>{ renderProfile(); });

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05); last=now;
  st.clock+=dt;
  ensureChunks(2);                 // 无限地形:每帧最多补建 2 块
  if(baseGroup) baseGroup.userData.beacon.visible = (st.clock%1.4)<.9;
  // 视口尺寸
  const vw=canvas.clientWidth, vh=canvas.clientHeight;
  const pr=renderer.getPixelRatio();
  if(canvas.width!==(vw*pr|0) || canvas.height!==(vh*pr|0)){
    renderer.setSize(vw,vh,false);
    camera.aspect=vw/vh; camera.updateProjectionMatrix();
  }
  updateRover(dt);
  updateLaser();
  updateCamera(dt);
  updateTele(dt);
  renderNav();
  renderProfile();
  renderGyro();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
